<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLAMES</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #1a1919;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            display: flex;
            justify-content: center;
        }

        
        .container {
            width: 90vw;
            height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
            
            color: white;
        }
        form {
            width: 60%;
            display: flex;
            flex-direction: column;
            background-color: #383737;
            padding: 40px;
            border-radius: 15px;

            justify-content: center;
            align-items: center;
        }
        .fields {
            width: 100%;
            display: flex;
            /* gap: 30px; */
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 18px;
            width: 100%;
        }
        
        label {
            min-width: 60px;
        }
        input {
            width: 80%;
            padding-top: 20px;
            padding-bottom: 20px;
            background-color: rgb(112, 112, 113);
            color: white;
            font-size: large;
            font-weight: 400;
            border: none;

            text-align: center;
        }

        #btn {
            width: 100%;
            padding: 20px;
            font-size: 35px;
            font-weight: 900;
        }

        center {
            margin-bottom: 20px;
        }

        .result {
            margin-top: 10px;
            font-size: larger;
        }

        .res {
            color: red;
        }
    </style>

</head>
<body>
    <div class="container">
        <form action="/send" method="post">
            <center><h1>FLAMES GENERATOR</h1></center>

            <div class="fields">
                <label for="name1"><h2>Name 1</h2></label>
                <input type="text" name="name1" id="name1" required>
            </div>
            <div class="fields">
                <label for="name2"><h2>Name 2</h2></label>
                <input type="text" name="name2" id="name2" required>
            </div>
            <button type="submit" id="btn">Submit</button>

            {% if result %}
            <div class="result">
                <h4>Result: <span class="res">{{resvalue}}</span></h4>
            </div>
            {% endif %}
        </form>
    </div>

</body>
</html>
